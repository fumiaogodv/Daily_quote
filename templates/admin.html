<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>语录管理后台</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 150px; }
        .quote { margin: 6px 0; }
        button { margin-left: 10px; }
    </style>
</head>
<body>

<h1>📚 语录管理后台</h1>

<h2>➕ 批量添加语录（每行一条）</h2>
<form method="post" action="/admin/add">
    <textarea name="text" placeholder="每行一条语录"></textarea><br><br>
    <button type="submit">批量添加</button>
</form>

<hr>

<h2>📄 当前数据库内容（{{ quotes|length }} 条）</h2>

{% for q in quotes %}
<div class="quote">
    <b>#{{ q.id }}</b> {{ q.content }}
    <a href="/admin/delete/{{ q.id }}">
        <button>删除</button>
    </a>
</div>
{% endfor %}

</body>
</html>
